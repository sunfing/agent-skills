interface:
  display_name: "ArcGIS Forestry Corner Table"
  short_description: "Convert ArcGIS forestry corner exports into approval-ready Excel"
  default_prompt: "Use $arcgis-forestry-corner-table to validate an ArcGIS-exported forestry corner-point table and generate the approval-ready Excel workbook next to the input file by default; only use another output directory when the user requests it or the original local directory is unavailable."

policy:
  allow_implicit_invocation: true
